<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fetchreel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12141a;
    --surface: #1b1e27;
    --border: #2a2e3a;
    --text: #ecece3;
    --muted: #8b8f9c;
    --accent: #e8a33d;
    --accent-ink: #14110a;
    --error: #e8735f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem 3rem;
  }

  main { width: 100%; max-width: 620px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    margin-bottom: 3rem;
  }

  .brand-mark {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    border-top-color: transparent;
    transform: rotate(45deg);
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    line-height: 1.25;
    margin: 0 0 1.75rem;
    max-width: 22ch;
  }

  form.fetch-form {
    display: flex;
    gap: 0.6rem;
  }

  input[type="url"] {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 0.85rem 1rem;
  }

  input[type="url"]::placeholder { color: var(--muted); }

  input[type="url"]:focus,
  button:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    border: none;
    border-radius: 10px;
    padding: 0.85rem 1.3rem;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  button:disabled { cursor: default; opacity: 0.6; }

  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover:not(:disabled) { opacity: 0.9; }

  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent); }

  .status {
    margin-top: 0.9rem;
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 1.2em;
  }

  .status.error { color: var(--error); }

  .result-card {
    margin-top: 1.75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    display: none;
    gap: 1rem;
    grid-template-columns: 108px 1fr;
    animation: reveal 0.25s ease;
  }

  .result-card.visible { display: grid; }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-card img {
    width: 108px;
    height: 108px;
    object-fit: cover;
    border-radius: 8px;
    background: var(--bg);
  }

  .result-meta { min-width: 0; }

  .result-title {
    font-weight: 600;
    font-size: 0.98rem;
    line-height: 1.4;
    margin: 0 0 0.3rem;
    overflow-wrap: anywhere;
  }

  .result-sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 1rem;
  }

  .result-actions {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 0.8rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
  }

  footer {
    margin-top: 3rem;
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.6;
    max-width: 46ch;
    text-align: center;
  }

  @media (max-width: 480px) {
    form.fetch-form { flex-direction: column; }
    .result-card { grid-template-columns: 1fr; }
    .result-card img { width: 100%; height: 180px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .result-card { animation: none; }
  }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="brand-mark"></span>Fetchreel</div>

  <h1>Paste a video link. Any site yt-dlp knows.</h1>

  <form class="fetch-form" id="fetchForm">
    <input type="url" id="urlInput" placeholder="https://…" required autocomplete="off">
    <button type="submit" class="btn-primary" id="fetchBtn">Fetch details</button>
  </form>

  <p class="status" id="status"></p>

  <div class="result-card" id="resultCard">
    <img id="resultThumb" src="" alt="">
    <div class="result-meta">
      <p class="result-title" id="resultTitle"></p>
      <p class="result-sub" id="resultSub"></p>
      <div class="result-actions">
        <select id="qualitySelect"></select>
        <button type="button" class="btn-primary" id="downloadBtn">Download</button>
      </div>
    </div>
  </div>

  <footer>
    Fetchreel runs entirely on this server — nothing is sent anywhere else.
    Only download things you own or have permission to save; respect the
    source platform's terms and local copyright law.
  </footer>
</main>

<script>
const form = document.getElementById('fetchForm');
const urlInput = document.getElementById('urlInput');
const fetchBtn = document.getElementById('fetchBtn');
const statusEl = document.getElementById('status');
const card = document.getElementById('resultCard');
const thumb = document.getElementById('resultThumb');
const titleEl = document.getElementById('resultTitle');
const subEl = document.getElementById('resultSub');
const qualitySelect = document.getElementById('qualitySelect');
const downloadBtn = document.getElementById('downloadBtn');

function setStatus(message, isError = false) {
  statusEl.textContent = message || '';
  statusEl.classList.toggle('error', isError);
}

function formatDuration(seconds) {
  if (!seconds) return null;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = urlInput.value.trim();
  if (!url) return;

  card.classList.remove('visible');
  fetchBtn.disabled = true;
  setStatus('Reading the link…');

  try {
    const res = await fetch('/api/probe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();

    if (!res.ok) {
      setStatus(data.error || 'Something went wrong.', true);
      return;
    }

    titleEl.textContent = data.title;
    const bits = [data.uploader, formatDuration(data.duration)].filter(Boolean);
    subEl.textContent = bits.join(' · ');
    thumb.src = data.thumbnail || '';
    thumb.style.visibility = data.thumbnail ? 'visible' : 'hidden';

    qualitySelect.innerHTML = '';
    data.options.forEach((opt) => {
      const el = document.createElement('option');
      el.value = opt.value;
      el.textContent = opt.label;
      qualitySelect.appendChild(el);
    });

    card.classList.add('visible');
    setStatus('');
  } catch (err) {
    setStatus('Couldn\'t reach the server. Try again.', true);
  } finally {
    fetchBtn.disabled = false;
  }
});

downloadBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  const format = qualitySelect.value;

  downloadBtn.disabled = true;
  downloadBtn.textContent = 'Downloading…';
  setStatus('Downloading — this can take a moment for longer videos.');

  try {
    const res = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, format }),
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      setStatus(data.error || 'Download failed.', true);
      return;
    }

    const blob = await res.blob();
    const disposition = res.headers.get('Content-Disposition') || '';
    const match = disposition.match(/filename="?([^"]+)"?/);
    const filename = match ? match[1] : 'download';

    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setStatus('Done — check your downloads folder.');
  } catch (err) {
    setStatus('Couldn\'t reach the server. Try again.', true);
  } finally {
    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Download';
  }
});
</script>
</body>
</html>
